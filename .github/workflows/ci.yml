name: CI

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-main
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Build admin
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Setup SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.OVH_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -p 22 -H "${{ secrets.OVH_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Rsync app
        run: |
          rsync -az --delete \
            --exclude '.git' \
            --exclude '.github' \
            --exclude '.venv' \
            --exclude 'venv' \
            --exclude '__pycache__' \
            --exclude '*.pyc' \
            --exclude '.env' \
            --exclude '.bootstrap-admin' \
            --exclude 'staticfiles' \
            --exclude 'db.sqlite3' \
            --exclude 'node_modules' \
            --exclude 'frontend/node_modules' \
            -e "ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new" \
            ./ ${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }}:/opt/beatlab/

      - name: Remote migrate + restart
        run: |
          ssh -i ~/.ssh/id_ed25519 -o StrictHostKeyChecking=accept-new \
            ${{ secrets.OVH_USER }}@${{ secrets.OVH_HOST }} << 'EOF'
          set -e
          cd /opt/beatlab
          if [[ ! -x venv/bin/pip || ! -f /etc/systemd/system/beatlab.service ]]; then
            echo "venv or systemd unit missing — run deploy/bootstrap.sh once on the server"
            exit 1
          fi
          chown -R beatlab:beatlab /opt/beatlab
          if [[ -f .env ]]; then
            chown beatlab:beatlab .env
            chmod 640 .env
          fi
          venv/bin/pip install -q -r requirements.txt
          sudo -u beatlab env DJANGO_SETTINGS_MODULE=config.settings \
            venv/bin/python manage.py migrate --noinput
          sudo -u beatlab env DJANGO_SETTINGS_MODULE=config.settings \
            venv/bin/python manage.py collectstatic --noinput
          systemctl restart beatlab
          cp /opt/beatlab/deploy/nginx-hub.conf /etc/nginx/sites-available/hub
          ln -sfn /etc/nginx/sites-available/hub /etc/nginx/sites-enabled/hub
          nginx -t
          systemctl reload nginx
          EOF
