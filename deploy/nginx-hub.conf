# BeatLab Hub — hub.nynusoft.com
#   sudo cp /opt/beatlab/deploy/nginx-hub.conf /etc/nginx/sites-available/hub
#   sudo ln -sfn /etc/nginx/sites-available/hub /etc/nginx/sites-enabled/hub
#   sudo nginx -t && sudo systemctl reload nginx

upstream beatlab_backend {
    server 127.0.0.1:8009 fail_timeout=0;
}

server {
    listen 80;
    listen [::]:80;
    server_name hub.nynusoft.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://hub.nynusoft.com$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name hub.nynusoft.com;

    ssl_certificate /etc/letsencrypt/live/hub.nynusoft.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/hub.nynusoft.com/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    client_max_body_size 10M;

    location /api/ {
        proxy_pass http://beatlab_backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
    }

    # Monitor (Operators): upgrade WebSocket. Requiere Daphne, no Gunicorn sync.
    location /ws/ {
        proxy_pass http://beatlab_backend;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;
        proxy_send_timeout 86400;
    }

    location /static/ {
        alias /opt/beatlab/staticfiles/;
        expires 30d;
        add_header Cache-Control "public";
    }

    location / {
        root /opt/beatlab/frontend/dist;
        try_files $uri $uri/ /index.html;
    }
}
